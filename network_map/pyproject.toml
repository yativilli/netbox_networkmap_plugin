[build-system]
requires = ["setuptools >= 77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "network_map"
version = "0.1.0"
requires-python = ">=3.12.0"
authors = [
    { name = "Yannick Wernle", email = "yannick@wernle.net" }
]
description = "A network_map plugin for netbox"
readme = { file = "README.md", content-type = "text/markdown"}

[tool.setuptools]
include-package-data = true
packages = ["network_map"]

[tool.setuptools.package-dir]
network_map = "."

[tool.setuptools.package-data]
network_map = [
    "templates/**",
    "static/**",
    "locale/**/*.mo"
]
