[project]
name = "network_map"
dynamic = ["version"]
requires-python = ">=3.12.0"
authors = [
    { name = "Yannick Wernle", email = "yannick@wernle.net" }
]
description = "A network_map plugin for netbox"
license = "GPL-3.0"
readme = "README.md"

[project.optional-dependencies]
# Only needed to answer `?format=png`: NetBox itself never rasterises SVG.
# ImageMagick on the server works as well and needs no package here.
png = ["cairosvg>=2.7"]

[project.urls]
Homepage = "https://github.com/yativilli/netbox_networkmap_plugin"
Repository = "https://github.com/yativilli/netbox_networkmap_plugin"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true

[tool.setuptools.dynamic]
version = { attr = "network_map.__version__" }

[tool.setuptools.packages.find]
include = ["network_map", "network_map.*"]

[tool.setuptools.package-data]
network_map = [
    "templates/**",
    "static/**",
    "locale/**/*.mo"
]
